<!-- Top Bar -->
<header class="flex justify-between items-center px-edge-margin h-14 w-full z-10">
<button onclick="history.back()" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors active:opacity-80">

<div class="flex flex-col items-center">

<span class="font-label-md text-label-md text-on-surface-variant">Now Playing</span>
</div>

</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-edge-margin pb-xl relative overflow-hidden">
<!-- Ambient Blur Background -->

<!-- Center Stage: Album Art -->

<div class="w-full aspect-square max-w-[340px] relative">
<div class="absolute inset-0 bg-primary-container/20 blur-xl rounded-xl translate-y-4"></div>
<div class="relative w-full h-full rounded-xl overflow-hidden shadow-2xl border border-outline-variant/30">
<img class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDiQ3mNs77P-Kscrrwm5ExdxU1NpKWrmXe4MzsQCB5QOvL1wpxHSL5uhMVkgNFcaJnkClkoRhnjT-i1TqWLdCjM3-ZvgIf-rm0RPfAXLugc5czhZZCRrZxT56EH9voIxVCJdov2aN6Fs9jjCxI2lCGUFqaE1FT5jpQEnnc3jZsSgNaIYGOol0BB1clYJWSgpKH21hzpyLfoStIsGoWT_oUS81LDzXu1e27HoAfGceLLSFCQJ8RUI4kdX60Vv9eaMGiqQsjwZ84oh4KL" alt="Cover Image">
</div>
</div>
</div>
<!-- Track Info -->
<div class="flex justify-between items-end mb-lg">
<div class="flex flex-col gap-1 overflow-hidden">
<h1 class="font-display-sm text-display-sm text-on-primary-container truncate leading-tight">Song Name</h1>
<p class="font-title-md text-title-md text-on-surface-variant truncate">Artist Name</p>
</div>
<button class="p-2 transition-transform active:scale-90" id="like-btn" onclick="toggleLike()">
<span class="material-symbols-outlined text-primary-container text-[28px]" id="heart-icon" style="font-variation-settings: &quot;FILL&quot; 1;">favorite</span>

</div>
<!-- Interactive Slider Overlay -->
<input class="progress-slider absolute w-[calc(100%-32px)] h-1 opacity-0 cursor-pointer" max="100" min="0" type="range" value="36">
<div class="flex justify-between">
<span class="font-label-md text-label-md text-on-surface-variant">01:24</span>
<span class="font-label-md text-label-md text-on-surface-variant">03:45</span>
</div>

<span class="material-symbols-outlined text-[24px]">shuffle</span>
</button>
<div class="flex items-center gap-lg">
<button class="text-on-surface hover:text-primary transition-colors active:scale-95">

</button>
<button class="text-on-surface hover:text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: &quot;FILL&quot; 1;">skip_next</span>
</button>
</div>
<button class="text-primary-container transition-colors">
<span class="material-symbols-outlined text-[24px]">repeat</span>
</button>
</div>

<div class="absolute top-0 left-0 h-full bg-on-surface-variant w-[65%]"></div>
</div>

</div>
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">volume_up</span>
</div>
</main>
<!-- Visualizer Background Animation (Simulated) -->

<script>
        let isPlaying = true;
        let isLiked = true;

        function togglePlay() {
            isPlaying = !isPlaying;
            const icon = document.getElementById('play-icon');
            icon.textContent = isPlaying ? 'pause' : 'play_arrow';
            
            // Interaction effect
            const btn = document.getElementById('play-pause-btn');
            btn.classList.add('scale-95');
            setTimeout(() => btn.classList.remove('scale-95'), 100);
        }

        function toggleLike() {
            isLiked = !isLiked;
            const icon = document.getElementById('heart-icon');
            if (isLiked) {
                icon.textContent = 'favorite';
                icon.classList.replace('text-on-surface-variant', 'text-primary-container');
                icon.style.fontVariationSettings = "'FILL' 1";
            } else {
                icon.textContent = 'favorite';
                icon.classList.replace('text-primary-container', 'text-on-surface-variant');
                icon.style.fontVariationSettings = "'FILL' 0";
            }
        }

        // Simple touch feedback for progress bar
        const progressSlider = document.querySelector('.progress-slider');
        progressSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            const bar = e.target.previousElementSibling.firstElementChild;
            bar.style.width = val + '%';
        });

        // Volume slider sync
        const volumeSlider = document.querySelector('.volume-slider');
        volumeSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            const bar = e.target.previousElementSibling.firstElementChild;
            bar.style.width = val + '%';
        });
    </script>
